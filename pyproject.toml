[project]
name = "claude-voice"
version = "0.1.0"
description = "Local voice gateway: xiaozhi-esp32 device <-> ASR/TTS <-> Claude Code"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.10",
    "numpy>=1.26",
    "av>=14",
    "faster-whisper>=1.1",
    "torch>=2.7",
    "torchaudio>=2.7",
    "omegaconf>=2.3",
    "pyyaml>=6",
    "silero-vad>=5.1",
    "num2words>=0.5.13",
    "pillow>=13",
    "pystray>=0.19.5",
    "yt-dlp>=2025.1",
    "yandex-music>=2.2",
    "esptool>=4.8",
    "esp-idf-nvs-partition-gen>=0.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
extend-exclude = ["firmware", "build_exe", "proto"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

